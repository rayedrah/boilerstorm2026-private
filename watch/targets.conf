# svcwatch targets. One check per line:  NAME  HOST  CHECK  ARG
#   HOST: PUB.x = 10.100.<team>.x (what Quotient uses)   LAN.x = 10.42.0.x (inside)
#   CHECK: ping | tcp <port> | banner <port> | http <url-path> | https <url-path> | dns <name>
#   http/https: the page content is fingerprinted on first success; later changes are flagged (defacement)
#               add  ,nohash  to the path to only check the status code (e.g. /,nohash)
#   dns: the answer is remembered on first success; later changes are flagged (DNS tampering)
# A check that has NEVER been up shows NEVER-UP in gray instead of red (the service may not exist).
# EDIT ON THE DAY: once Quotient shows the real scored services, delete what is not scored and add what is.

# ---------------- firewall
fw-wan-ping      PUB.1    ping
fw-lan-gui       LAN.1    tcp    443

